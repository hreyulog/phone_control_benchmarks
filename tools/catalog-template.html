<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone control · 100 tasks / 手机控制</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#213747;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{background:#173f51;color:#fff;padding:32px max(22px,calc((100vw - 1200px)/2))}h1{font-size:30px;line-height:1.3;margin:12px 0}header p{color:#d3e6e9;max-width:950px}main{max-width:1244px;margin:auto;padding:22px}.intro,.card{background:#fff;border:1px solid #dde5e9;border-radius:14px;padding:20px}.intro{margin-bottom:18px}.links{display:flex;gap:18px;flex-wrap:wrap}a{color:#216880}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;position:sticky;top:0;background:#f3f6f8ee;backdrop-filter:blur(10px);padding:12px 0}input,select,button{font:inherit;border:1px solid #ccd9de;background:white;border-radius:8px;padding:9px}input{flex:1;min-width:200px}button{cursor:pointer;color:#245e70}button:hover{background:#eef7f7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{overflow-wrap:anywhere}.card h2{font-size:19px;margin:8px 0}.tags{display:flex;gap:6px;flex-wrap:wrap;color:#536e7a;font-size:12px}.tag{background:#eef4f5;border-radius:6px;padding:3px 7px}.prompt{white-space:pre-wrap;padding:12px;background:#eff6f7;border-left:3px solid #3a8089;border-radius:6px;margin:12px 0}.focus{color:#287760}.muted{color:#647984;font-size:13px}summary{cursor:pointer;font-weight:600}#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#163c4e;color:white;padding:10px 18px;border-radius:8px;z-index:10}@media(max-width:760px){.grid{grid-template-columns:1fr}.bar{position:static}main{padding:14px}h1{font-size:24px}}@media print{button,.bar{display:none}.grid{display:block}.card{break-inside:avoid;margin-bottom:10px}}</style>
<header><label for="lang">Language / 语言 </label><select id="lang" aria-label="Language / 语言"><option value="en">English</option><option value="zh-CN">简体中文</option></select><h1 id="title"></h1><p id="stats"></p><p id="lead"></p></header><main><section class="intro"><b id="start"></b><p id="flow"></p><div id="links" class="links"></div><p id="caution" class="muted"></p><p id="payload" class="muted"></p></section><div class="bar"><input id="q"><select id="cat"></select><select id="difficulty"></select><select id="batch"></select><button id="reset"></button></div><p id="count" class="muted"></p><div id="cards" class="grid"></div></main><div id="toast" role="status"></div><script type="application/json" id="data">__TASK_DATA__</script><script>
const tasks=JSON.parse(document.getElementById('data').textContent),$=s=>document.getElementById(s),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const strings={en:{title:'100 phone-control user scenarios',stats:'10 categories × 10 tasks · 30 easy / 40 medium / 30 hard · 80 tuning + 20 public holdout · 20 smoke',lead:'User input → target Agent execution → independent final-state verification → fixed-rule scoring. This catalog contains scenarios, not real-device results.',start:'Any evaluation Agent can start here',flow:'Read AGENTS.md, run doctor and local tests, configure real devices, then init → prepare → normal-chat execution → assessment → score. Without a phone, demo rehearses the pipeline and is explicitly labeled simulation.',caution:'Copying gives a prompt template. Use prepare to bind dates, devices and RUN_ID before sending. Never send acceptance, optimization guidance or the operator checklist to the target. Public holdout does not guarantee isolation.',payload:'English retains Chinese contacts, quoted input, app targets and fixture bytes. S097 intentionally mixes languages. Select --lang en at init for English prompts, checklists and reports.',search:'Search tasks / prompts / optimization (English or Chinese)',category:'Category',allCategory:'All categories',difficulty:'Difficulty',allDifficulty:'All difficulties',batch:'Batch',all:'All 100',smoke:'Smoke 20',tuning:'Tuning 80',holdout:'Public holdout 20',reset:'Reset',easy:'Easy',medium:'Medium',hard:'Hard',accept:'Acceptance criteria',focus:'Optimization focus',details:'Prerequisites, parameters and multi-turn steps',params:'Parameters',none:'None',outcome:'Expected outcome',gate:'Approval gate',copy:'Copy user prompt',copied:'Template copied; bind parameters with prepare before sending',copiedPlain:'User prompt copied; no phone task dispatched',manual:'Please select and copy the prompt manually',count:'shown / 100 · no execution scores on this page',docs:['Usage guide','Agent entry','Execution protocol','Scoring rules','100-task JSON','Frozen file hashes','Environment template']},'zh-CN':{title:'100 个手机控制用户场景',stats:'10 类 × 10 项 · 简单 30 / 中等 40 / 困难 30 · 迭代 80 + 公开留出 20 · 首轮 20',lead:'普通用户输入 → 被测 Agent 执行 → 独立终态核验 → 固定规则评分。本目录是场景库，不包含真机成绩。',start:'任意评估 Agent 从这里开始',flow:'先读 AGENTS.md，运行 doctor 和本地测试，配置实际设备，再 init → prepare → 普通聊天执行 → 填写 assessment → score。没有手机可以运行 demo，它明确标记模拟，不计真机分。',caution:'复制的是用户提示模板；缺日期、设备、RUN_ID 等参数时请使用 prepare 绑定。验收、优化提示、operator-checklist 不提交给被测 Agent。公共 holdout 不保证保密隔离。',payload:'英文版保留中文联系人、精确输入、原 App 与 fixture 字节；S097 特意保持混合语言。init --lang en 会生成英文提示、清单和报告。',search:'搜索任务 / 用户指令 / 优化方向（中英文）',category:'类别',allCategory:'全部类别',difficulty:'难度',allDifficulty:'全部难度',batch:'分组',all:'全部 100',smoke:'首轮 20',tuning:'迭代 80',holdout:'公开留出 20',reset:'重置',easy:'简单',medium:'中等',hard:'困难',accept:'成功判据',focus:'优化方向',details:'准备条件、参数和多轮步骤',params:'参数',none:'无',outcome:'预期终态',gate:'审批条件',copy:'复制用户提示',copied:'已复制模板；发送前请用 prepare 绑定参数',copiedPlain:'已复制用户提示；未派发手机任务',manual:'请手动选择提示文字复制',count:'/ 100 项 · 此页面不展示执行成绩',docs:['使用说明','Agent 入口','执行协议','评分规则','100 项 JSON','冻结文件哈希','环境模板']}};
const cats=[...new Set(tasks.map(t=>t.category))],local=t=>$('lang').value==='en'?{...t,...t.translations.en}:t,S=()=>strings[$('lang').value];
function options(id,items){const old=$(id).value;$(id).innerHTML=items.map(([v,label])=>'<option value="'+esc(v)+'">'+esc(label)+'</option>').join('');if(items.some(x=>x[0]===old))$(id).value=old;}
function locale(){const s=S(),en=$('lang').value==='en',suffix=en?'':'.zh-CN';document.documentElement.lang=$('lang').value;['title','stats','lead','start','flow','caution','payload'].forEach(k=>$(k).textContent=s[k]);$('q').placeholder=s.search;$('q').setAttribute('aria-label',s.search);$('reset').textContent=s.reset;for(const k of ['cat','difficulty','batch'])$(k).setAttribute('aria-label',s[k==='cat'?'category':k]);options('cat',[['',s.allCategory],...cats.map((c,i)=>[c,local(tasks[i*10]).category])]);options('difficulty',[['',s.allDifficulty],...['easy','medium','hard'].map(k=>[k,s[k]])]);options('batch',['all','smoke','tuning','holdout'].map(k=>[k,s[k]]));const urls=['README'+suffix+'.md','AGENTS'+suffix+'.md','docs/PROTOCOL'+suffix+'.md','docs/SCORING'+suffix+'.md','dataset/tasks.json','dataset/manifest.json','config/environment.example.json'];$('links').innerHTML=urls.map((url,i)=>'<a href="'+url+'">'+s.docs[i]+'</a>').join('');render();}
function render(){const s=S(),q=$('q').value.trim().toLowerCase(),c=$('cat').value,d=$('difficulty').value,b=$('batch').value;const rows=tasks.filter(t=>(!q||[t.id,t.category,t.title,t.user_prompt,t.optimization_focus,...Object.values(t.translations.en).flat()].join(' ').toLowerCase().includes(q))&&(!c||t.category===c)&&(!d||t.difficulty===d)&&(b==='all'||(b==='smoke'?t.smoke:t.split===b))).map(local);$('count').textContent=rows.length+' '+s.count;$('cards').innerHTML=rows.map(t=>'<article class="card" id="'+t.id+'"><div class="tags"><span class="tag">'+t.id+'</span><span class="tag">'+esc(t.category)+'</span><span class="tag">'+s[t.difficulty]+'</span><span class="tag">'+s[t.split]+'</span>'+(t.smoke?'<span class="tag">'+s.smoke+'</span>':'')+'</div><h2>'+esc(t.title)+'</h2><div class="prompt">'+esc(t.user_prompt)+'</div><b>'+s.accept+'</b><p>'+esc(t.acceptance.join('; '))+'</p><p class="focus">'+s.focus+': '+esc(t.optimization_focus)+'</p><details><summary>'+s.details+'</summary><ul>'+t.preconditions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p>'+s.params+': '+esc(t.parameters.join(', ')||s.none)+'</p><p>'+s.outcome+': '+esc(t.expected_outcome)+'; '+s.gate+': '+esc(t.gate)+'</p><ol>'+t.run_sequence.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></details><button data-id="'+t.id+'">'+s.copy+'</button></article>').join('');}
['q','cat','difficulty','batch'].forEach(s=>$(s).addEventListener(s==='q'?'input':'change',render));$('lang').onchange=()=>{try{localStorage.setItem('phone-bench-lang',$('lang').value);}catch{}locale();};$('reset').onclick=()=>{$('q').value='';$('cat').value='';$('difficulty').value='';$('batch').value='all';render();};document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;const t=local(tasks.find(t=>t.id===b.dataset.id)),s=S();try{await navigator.clipboard.writeText(t.user_prompt);}catch{const a=document.createElement('textarea');a.value=t.user_prompt;document.body.append(a);a.select();const copied=document.execCommand('copy');a.remove();if(!copied){alert(s.manual);return;}}$('toast').textContent=t.parameters.length?s.copied:s.copiedPlain;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400);});
let initial=new URLSearchParams(location.search).get('lang');if(!strings[initial])try{initial=localStorage.getItem('phone-bench-lang');}catch{}if(!strings[initial])initial=navigator.language.toLowerCase().startsWith('zh')?'zh-CN':'en';$('lang').value=initial;locale();
</script></html>
